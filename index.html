<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sell Your House | Screening Preshow</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 14px;
  background:#2b2220 repeating-linear-gradient(45deg,#2f2523 0 6px,#2b2220 6px 12px);
  font:14px "Lucida Grande","Segoe UI",Tahoma,sans-serif;color:#222}
/* the window */
.win{width:min(760px,100%);background:#dcdcdc;border:1px solid #6f6f6f;border-radius:8px 8px 4px 4px;
  box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 #fff;overflow:hidden}
.titlebar{position:relative;height:30px;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(#f4f4f4 0 1px,#d2d2d2 1px 3px);border-bottom:1px solid #8a8a8a}
.titlebar h1{margin:0;padding:0 12px;font-size:14px;font-weight:600;background:#e6e6e6;letter-spacing:.02em}
.chrome{margin:10px;border:1px solid #9c9c9c;border-radius:6px;overflow:hidden}
.grid{background:#fff;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
/* tiles */
.tile{all:unset;cursor:pointer;display:block;background:linear-gradient(#fdfdfd,#ededed);border:1px solid #c4c4c4;border-radius:6px;
  padding:10px;box-shadow:0 1px 0 #fff inset,0 2px 4px rgba(0,0,0,.12);text-align:center;transition:transform .12s,box-shadow .12s}
.tile:hover,.tile:focus-visible{transform:translateY(-2px);box-shadow:0 1px 0 #fff inset,0 6px 14px rgba(0,0,0,.2);border-color:#7a8fb8}
.tile:focus-visible{outline:2px solid #3b6fd8;outline-offset:2px}
.tile img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:3px;border:1px solid #999;background:#000}
.tile strong{display:block;margin-top:8px;font-size:14px;color:#b02c26}
.tile small{display:block;color:#666;font-size:12px;margin-top:2px}
.tile .badge{display:inline-block;margin-top:5px;font-size:10px;letter-spacing:.08em;color:#fff;background:#b02c26;border-radius:8px;padding:1px 7px}
/* player */
.stage{position:fixed;inset:0;background:#000;display:none;z-index:10}
.stage.on{display:block}
.stage video{width:100%;height:100%;object-fit:contain;background:#000}
.close{position:absolute;top:14px;right:14px;z-index:11;font:600 14px system-ui;color:#fff;background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.4);border-radius:18px;padding:7px 14px;cursor:pointer}
</style>
</head>
<body>
<div class="win" role="application" aria-label="Sell Your House preshow player">
  <div class="titlebar"><h1>Welcome to Sell Your House</h1></div>
  <div class="chrome"><div class="grid" id="grid"></div></div>
</div>
<div class="stage" id="stage"><video id="player" playsinline controls preload="none"></video><button class="close" id="close" type="button">Close &times;</button></div>
<script>
// One tile per video. Add new edits here.
// plays: Infinity = repeat until closed; 1 = play the file once, then return to the window.
const VIDEOS = [
  {id: '15min-clean', title: '15 min · Clean audio', note: 'Trailer plays twice, then stops · curse words bleeped', file: 'preshow-15min-clean.mp4', thumb: 'thumb-clean.jpg', plays: 1, badge: 'NEW'},
  {id: '15min-uncut', title: '15 min · Uncut audio', note: 'Trailer plays twice, then stops · original audio', file: 'preshow-15min-uncut.mp4', thumb: 'thumb-uncut.jpg', plays: 1, badge: 'NEW'},
  {id: 'clean', title: 'Loop · Clean audio', note: 'Repeats until you close it · curse words bleeped', file: 'preshow-clean.mp4', thumb: 'thumb-clean.jpg', plays: Infinity, badge: 'RECOMMENDED'},
  {id: 'clean-3x', title: '3× · Clean audio', note: '13:23, three cycles, then stops · bleeped', file: 'preshow-3x-clean.mp4', thumb: 'thumb-clean.jpg', plays: 1},
  {id: 'uncut', title: 'Loop · Uncut audio', note: 'Repeats until you close it · original audio', file: 'preshow-uncut.mp4', thumb: 'thumb-uncut.jpg', plays: Infinity},
  {id: 'uncut-3x', title: '3× · Uncut audio', note: '13:23, three cycles, then stops · original audio', file: 'preshow-3x-uncut.mp4', thumb: 'thumb-uncut.jpg', plays: 1},
];
const grid = document.getElementById('grid'), stage = document.getElementById('stage'), player = document.getElementById('player'),
      closeBtn = document.getElementById('close');
let playsLeft = 0;

function stop() {
  player.pause();
  stage.classList.remove('on');
  if (location.hash) history.replaceState(null, '', location.pathname);
}
function play(v) {
  player.src = v.file;
  player.loop = v.plays === Infinity;  // seamless repeat for the endless loop
  playsLeft = v.plays;
  stage.classList.add('on');
  history.replaceState(null, '', '#' + v.id);
  player.play().catch(() => {});
  // Full screen must start inside the click. iPhone Safari only supports it on the video itself.
  if (stage.requestFullscreen) stage.requestFullscreen().catch(() => {});
  else if (player.webkitEnterFullscreen) player.webkitEnterFullscreen();
}
for (const v of VIDEOS) {
  const b = document.createElement('button');
  b.className = 'tile'; b.type = 'button';
  b.setAttribute('aria-label', 'Play ' + v.title + ' full screen');
  b.append(Object.assign(document.createElement('img'), {src: v.thumb, alt: '', loading: 'lazy'}),
           Object.assign(document.createElement('strong'), {textContent: v.title}),
           Object.assign(document.createElement('small'), {textContent: v.note}));
  if (v.badge) b.append(Object.assign(document.createElement('span'), {className: 'badge', textContent: v.badge}));
  b.onclick = () => play(v);
  grid.append(b);
}
closeBtn.onclick = () => document.fullscreenElement ? document.exitFullscreen() : stop();
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) stop(); });
player.addEventListener('webkitendfullscreen', stop);
player.addEventListener('ended', () => {
  if (--playsLeft > 0) { player.currentTime = 0; player.play().catch(() => {}); return; }
  if (document.fullscreenElement) document.exitFullscreen(); else if (player.webkitExitFullscreen) player.webkitExitFullscreen();
  stop();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && stage.classList.contains('on') && !document.fullscreenElement) stop(); });
</script>
</body>
</html>
